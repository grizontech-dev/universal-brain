services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grizon-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:  grizon_user
      POSTGRES_PASSWORD: grizon_password_123
      POSTGRES_DB: grizon_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-app-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grizon_user -d grizon_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: grizon-pgweb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    environment:
      DATABASE_URL: ${PGWEB_DATABASE_URL:-postgres://grizon_user:grizon_password_123@postgres:5432/grizon_db?sslmode=disable}
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER:-}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS:-}
    command:
      - /usr/bin/pgweb
      - --bind=0.0.0.0
      - --listen=8081
      - --ssl=disable
      - --url=${PGWEB_DATABASE_URL:-postgres://grizon_user:grizon_password_123@postgres:5432/grizon_db?sslmode=disable}

  redis:
    image: redis:7-alpine
    container_name: grizon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: grizon-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  grizon-ai_unstructured:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    container_name: grizon-ai-unstructured
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      UNSTRUCTURED_MEMORY_FREE_MINIMUM_MB: "512"

  brain:
    profiles: ["backend", "brain"]
    build:
      context: ./Brain
      dockerfile: Dockerfile
    container_name: grizon-brain
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://app:app@postgres:5432/app?sslmode=disable
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8001"
    volumes:
      - ./Brain:/app/Brain
      - ./workspaces:/app/workspaces
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grizon-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      grizon-ai_unstructured:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://grizon_user:grizon_password_123@postgres:5432/grizon_db
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      UNSTRUCTURED_API_URL: http://grizon-ai_unstructured:8000
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - "4000:3000"
    command: ["sh", "-c", "node dist/db/migrations/run.js && node dist/index.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  qdrant_data:
